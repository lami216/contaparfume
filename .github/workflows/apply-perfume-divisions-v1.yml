              if f'  "{key}":' not in fr: fr_add.append(f'  "{key}": {value!r},\n'.replace("'",'"'))
          if fr_add:
              prefix=text[:fr_end].rstrip()
              if not prefix.endswith(','): prefix += ','
              text=prefix+'\n'+''.join(fr_add)+text[fr_end:]
          p.write_text(text)

          # Styles.
          css=Path("app/globals.css"); c=css.read_text()
          marker='/* perfume-divisions-v1 */'
          if marker not in c:
              c += r'''

