          replace_once("app/conta-app.tsx", '  products: "nav-products", parties: "nav-parties", banks: "nav-accounts",', '  products: "nav-products", perfumeDivisions: "nav-products", parties: "nav-parties", banks: "nav-accounts",')
          replace_once("app/conta-app.tsx", 'export const MAIN_NAV_ORDER = ["pos", "invoices", "warehouses", "products", "parties", "banks", "reports", "settings"] as const;', 'export const MAIN_NAV_ORDER = ["pos", "invoices", "warehouses", "products", "perfumeDivisions", "parties", "banks", "reports", "settings"] as const;')
          replace_once("app/conta-app.tsx", 'const viewCapability:Record<View,string>={pos:"pos.view",purchases:"purchases.view",expenses:"expenses.view",customers:"customers.view",suppliers:"suppliers.view",warehouses:"warehouses.inventory.view",warehouseAdmin:"warehouses.view",transfers:"warehouses.transfer",adjustments:"warehouses.adjust",products:"products.view",records:"records.view",reports:"reports.view",banks:"banks.view",settings:"settings.view"};', 'const viewCapability:Record<View,string>={pos:"pos.view",purchases:"purchases.view",expenses:"expenses.view",customers:"customers.view",suppliers:"suppliers.view",warehouses:"warehouses.inventory.view",warehouseAdmin:"warehouses.view",transfers:"warehouses.transfer",adjustments:"warehouses.adjust",products:"products.view",perfumeDivisions:"perfume.divisions.view",records:"records.view",reports:"reports.view",banks:"banks.view",settings:"settings.view"};')
          replace_once("app/conta-app.tsx", '["pos","purchases","records","products","customers","suppliers","warehouses","expenses","banks","reports","settings"] as View[]', '["pos","purchases","records","products","perfumeDivisions","customers","suppliers","warehouses","expenses","banks","reports","settings"] as View[]')
          replace_once("app/conta-app.tsx", '{view === "products" && <Products data={data} run={run} />}{" "}', '{view === "products" && <Products data={data} run={run} />}{" "}\n              {view === "perfumeDivisions" && <PerfumeDivisions data={data} run={run} />}{" "}')

          # API command integration.
          replace_once("app/api/command/route.ts", 'import { isProductExpired } from "../../domain.ts";', 'import { isProductExpired } from "../../domain.ts";\nimport { divisionLandedCost, roundedDivisionLiquidCost, type PerfumeAllocation, type PerfumeLot } from "../../perfume-logic.ts";')
          replace_once("app/api/command/route.ts", 'type Line = { id?: string; productId: string; quantity: number; description?: string; piecePrice?: number; unitPrice?: number; actualQuantity?: number; purchaseCost?: number | null; costAtSale?: number | null; grossProfit?: number | null };', 'type Line = { id?: string; productId: string; quantity: number; description?: string; piecePrice?: number; unitPrice?: number; actualQuantity?: number; purchaseCost?: number | null; costAtSale?: number | null; grossProfit?: number | null; perfumeAllocations?: PerfumeAllocation[] };')
          replace_once("app/api/command/route.ts", 'async function authoritativeCost(db: Db, session: ClientSession, product: Record<string, unknown>) {\n  if (Number.isFinite(product.lastPurchaseCost))', 'async function authoritativeCost(db: Db, session: ClientSession, product: Record<string, unknown>) {\n  if (product.perfumeForm === "partial" && Number.isFinite(Number(product.pieceCost))) return Number(product.pieceCost);\n  if (Number.isFinite(product.lastPurchaseCost))')

          route=Path("app/api/command/route.ts")
          text=route.read_text()
          anchor='\n\nexport async function execute(db: Db, session: ClientSession, body: Input) {'
          if anchor not in text: raise SystemExit('execute anchor missing')
          helpers=r'''

function perfumeLots(product: Record<string, unknown>) {
  return structuredClone(Array.isArray(product.perfumeLots) ? product.perfumeLots : []) as PerfumeLot[];
}
async function savePerfumeLots(db: Db, session: ClientSession, product: Record<string, unknown>, lots: PerfumeLot[]) {
  await db.collection("products").updateOne({ id: product.id }, { $set: { perfumeLots: lots } }, { session });
  product.perfumeLots = lots;
}
async function consumePerfumeLots(db: Db, session: ClientSession, product: Record<string, unknown>, warehouseId: string, quantity: number) {
  if (product.perfumeForm !== "decant") return null;
  if (!Number.isInteger(quantity) || quantity <= 0) throw new CommandError("كمية التقسيمات يجب أن تكون عددًا صحيحًا");
  const lots = perfumeLots(product).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  let remaining = quantity, totalCost = 0;
  const allocations: PerfumeAllocation[] = [];
  for (const lot of lots) {
    const available = Number(lot.stocks?.[warehouseId] ?? 0);
    if (available <= 0 || remaining <= 0) continue;
    const take = Math.min(available, remaining);
    lot.stocks = { ...(lot.stocks ?? {}), [warehouseId]: available - take };
    lot.remainingQuantity = Math.max(0, Number(lot.remainingQuantity ?? 0) - take);
    totalCost += take * Number(lot.landedUnitCost);
    allocations.push({ lotId: lot.id, quantity: take, unitCost: Number(lot.landedUnitCost), warehouseId });
    remaining -= take;
  }
  if (remaining > 0) throw new CommandError("مخزون دفعات التقسيمات غير كافٍ", 409);
  await savePerfumeLots(db, session, product, lots);
  return { allocations, totalCost, costAtSale: totalCost / quantity };
}
async function restorePerfumeAllocations(db: Db, session: ClientSession, product: Record<string, unknown>, allocations: PerfumeAllocation[] | undefined) {
  if (product.perfumeForm !== "decant" || !allocations?.length) return;
  const lots = perfumeLots(product), byId = new Map(lots.map(lot => [lot.id, lot]));
  for (const allocation of allocations) {
    const lot = byId.get(allocation.lotId); if (!lot) throw new CommandError("تعذر العثور على دفعة التقسيم الأصلية", 409);
    const amount = Number(allocation.quantity); const warehouseId = String(allocation.warehouseId);
    lot.stocks = { ...(lot.stocks ?? {}), [warehouseId]: Number(lot.stocks?.[warehouseId] ?? 0) + amount };
    lot.remainingQuantity = Number(lot.remainingQuantity ?? 0) + amount;
  }
  await savePerfumeLots(db, session, product, lots);
}
async function transferPerfumeLots(db: Db, session: ClientSession, product: Record<string, unknown>, fromId: string, toId: string, quantity: number) {
  if (product.perfumeForm !== "decant") return;
  if (!Number.isInteger(quantity) || quantity <= 0) throw new CommandError("كمية التقسيمات يجب أن تكون عددًا صحيحًا");
  const lots = perfumeLots(product).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  let remaining = quantity;
  for (const lot of lots) {
    const available = Number(lot.stocks?.[fromId] ?? 0); if (available <= 0 || remaining <= 0) continue;
    const move = Math.min(available, remaining);
    lot.stocks = { ...(lot.stocks ?? {}), [fromId]: available - move, [toId]: Number(lot.stocks?.[toId] ?? 0) + move };
    remaining -= move;
  }
  if (remaining > 0) throw new CommandError("لا يمكن نقل كمية تقسيمات أكبر من دفعات المخزن", 409);
  await savePerfumeLots(db, session, product, lots);
}
'''
          text=text.replace(anchor, helpers+anchor,1)
          route.write_text(text)

          # Split and recombine commands.
          route=Path("app/api/command/route.ts"); text=route.read_text()
          anchor='  const type = text(body.type);\n  if (type === "product.delete") {'
