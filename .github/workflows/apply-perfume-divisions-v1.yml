name: Apply perfume divisions v1
on:
  push:
    branches: [perfume-divisions-v1]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perfume-divisions-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Patch perfume divisions into existing accounting flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old,new,1))

          # Domain model: generated perfume forms, lots, and sale allocations.
          replace_once("app/domain.ts", "export type PaymentMethod = string;", "import type { PerfumeAllocation, PerfumeForm, PerfumeLot } from \"./perfume-logic\";\n\nexport type PaymentMethod = string;")
          replace_once("app/domain.ts", "  note?: string | null;\n  stocks: Record<string, number>;", "  note?: string | null;\n  perfumeForm?: PerfumeForm | null;\n  parentProductId?: string | null;\n  decantSizeMl?: number | null;\n  decantBottleCost?: number | null;\n  partialRemainingParts?: number | null;\n  partialOriginalParts?: number | null;\n  perfumeLots?: PerfumeLot[];\n  stocks: Record<string, number>;")
          replace_once("app/domain.ts", "  grossProfit?: number | null;\n}", "  grossProfit?: number | null;\n  perfumeAllocations?: PerfumeAllocation[];\n}")
          replace_once("app/domain.ts", "export function inventoryUnitCost(product: Pick<Product, \"lastPurchaseCost\" | \"pieceCost\">) {\n  return product.lastPurchaseCost ?? product.pieceCost ?? 0;\n}", "export function inventoryUnitCost(product: Pick<Product, \"lastPurchaseCost\" | \"pieceCost\" | \"perfumeForm\" | \"perfumeLots\">) {\n  if (product.perfumeForm === \"decant\" && product.perfumeLots?.length) {\n    const remaining = product.perfumeLots.reduce((sum, lot) => sum + Number(lot.remainingQuantity ?? 0), 0);\n    if (remaining > 0) return product.perfumeLots.reduce((sum, lot) => sum + Number(lot.remainingQuantity ?? 0) * Number(lot.landedUnitCost ?? 0), 0) / remaining;\n  }\n  return product.lastPurchaseCost ?? product.pieceCost ?? 0;\n}")

          # Brand tagline becomes perfume-specific and remains translated through tr().
          replace_once("lib/app-brand.ts", 'export const APP_TAGLINE = "نظام المتجر";', 'export const APP_TAGLINE = "العطور";')

          # Permissions.
          replace_once("lib/auth.ts", '  "expenses.view","expenses.create","expenses.edit","expenses.delete","reports.view","settings.view",', '  "expenses.view","expenses.create","expenses.edit","expenses.delete","perfume.divisions.view","perfume.divisions.manage","reports.view","settings.view",')
          replace_once("app/user-permissions.ts", '  { name: "المنتجات", actions: { view: "products.view", create: "products.create", edit: "products.edit", delete: "products.delete" } },', '  { name: "المنتجات", actions: { view: "products.view", create: "products.create", edit: "products.edit", delete: "products.delete" } },\n  { name: "التقسيمات", actions: { view: "perfume.divisions.view", create: "perfume.divisions.manage" } },')
          replace_once("app/user-permissions.ts", '    "products.view", "customers.view", "customers.collect", "suppliers.view", "suppliers.pay",', '    "products.view", "perfume.divisions.view", "perfume.divisions.manage", "customers.view", "customers.collect", "suppliers.view", "suppliers.pay",')

