          text=text[:start]+replacement+text[end:]; route.write_text(text)

          # Transfers move lot ownership with stock; generic adjustments are blocked for generated forms.
          replace_once("app/api/command/route.ts", '    for (const line of input) { const p = map.get(line.productId)!; await changeStock(db, session, p, from, -line.quantity, doc, "transfer-out"); await changeStock(db, session, p, to, line.quantity, doc, "transfer-in"); } await db.collection("documents").insertOne(doc, { session }); return doc.id;', '    for (const line of input) { const p = map.get(line.productId)!; if(p.perfumeForm==="decant")await transferPerfumeLots(db,session,p,fromId,toId,line.quantity); await changeStock(db, session, p, from, -line.quantity, doc, "transfer-out"); await changeStock(db, session, p, to, line.quantity, doc, "transfer-in"); } await db.collection("documents").insertOne(doc, { session }); return doc.id;')
          replace_once("app/api/command/route.ts", '    for (const line of input) {\n      const product = map.get(line.productId)!, before = Number((product.stocks as Record<string, number> | undefined)?.[warehouseId] ?? 0);', '    if(input.some(line=>["decant","partial"].includes(String(map.get(line.productId)?.perfumeForm??""))))throw new CommandError("لا يمكن تصحيح مخزون التقسيمات أو العطر الناقص يدويًا",409);\n    for (const line of input) {\n      const product = map.get(line.productId)!, before = Number((product.stocks as Record<string, number> | undefined)?.[warehouseId] ?? 0);')
          replace_once("app/api/command/route.ts", '"purchase.void":"purchases.delete","transfer.post":"warehouses.transfer"', '"purchase.void":"purchases.delete","perfume-split.post":"perfume.divisions.manage","perfume-recombine.post":"perfume.divisions.manage","transfer.post":"warehouses.transfer"')

          # Translations: add only keys that do not already exist in each locale object.
          message_pairs = {
            "العطور":"Parfums","التقسيمات":"Décants","تحويل عطر إلى تقسيمات":"Transformer un parfum en décants",
            "اختر عطرًا كاملًا، وسيحسب النظام تكلفة التقسيمة وسعر الطياح تلقائيًا.":"Choisissez un parfum entier. Le système calcule automatiquement le coût du décant et son coût de revient.",
            "العطر":"Parfum","اختر العطر":"Choisir le parfum","عدد التقسيمات":"Nombre de décants","حجم التقسيمة (ml)":"Volume du décant (ml)",
            "تكلفة زجاجة التقسيمة":"Coût du flacon du décant","سعر البيع للتقسيمة":"Prix de vente du décant","سعر شراء العطر":"Coût d’achat du parfum",
            "تكلفة السائل للتقسيمة":"Coût du parfum par décant","يُرفع تلقائيًا للعدد الصحيح الأعلى":"Arrondi automatiquement à l’entier supérieur","سعر الطياح":"Coût de revient",
            "ربح التقسيمة":"Bénéfice par décant","الربح المتوقع من كامل العطر":"Bénéfice prévu sur le parfum entier","المتوفر في المخزن":"Disponible dans le dépôt",
            "اعتماد التقسيم":"Valider le découpage","تم إنشاء التقسيمات":"Décants créés","دفعات التقسيمات":"Lots de décants",
            "كل عملية تقسيم تحتفظ بتكلفتها الأصلية حتى لو تغير سعر شراء العطر لاحقًا.":"Chaque lot conserve son coût d’origine même si le prix d’achat du parfum change ensuite.",
            "التقسيمة":"Décant","الأصل":"Initial","المتبقي":"Restant","تكلفة السائل":"Coût du parfum","تكلفة الزجاجة":"Coût du flacon","إرجاع الباقي":"Reconstituer le reste",
            "لا توجد تقسيمات حتى الآن":"Aucun décant pour le moment","مغلقة":"Clôturé","اجمع الباقي في مخزن واحد أولًا":"Regroupez d’abord le reste dans un seul dépôt",
            "تكلفة العطر الناقص":"Coût du parfum partiel","سعر بيع العطر الناقص":"Prix de vente du parfum partiel","تحويل إلى عطر ناقص":"Créer un parfum partiel","تم تحويل الباقي إلى عطر ناقص":"Reste transformé en parfum partiel",
            "كمية التقسيمات يجب أن تكون عددًا صحيحًا":"La quantité de décants doit être un entier","مخزون دفعات التقسيمات غير كافٍ":"Stock des lots de décants insuffisant",
            "تعذر العثور على دفعة التقسيم الأصلية":"Lot de décant d’origine introuvable","لا يمكن نقل كمية تقسيمات أكبر من دفعات المخزن":"Impossible de transférer plus de décants que les lots disponibles dans ce dépôt",
            "العطر غير موجود":"Parfum introuvable","لا يمكن تقسيم منتج مولد من التقسيمات":"Impossible de découper un produit généré à partir de décants",
            "عدد التقسيمات يجب أن يكون عددًا صحيحًا أكبر من 1":"Le nombre de décants doit être un entier supérieur à 1","لا توجد تكلفة شراء معتمدة لهذا العطر":"Aucun coût d’achat fiable pour ce parfum",
            "دفعة التقسيم غير موجودة":"Lot de décant introuvable","لا توجد تقسيمات متبقية في هذه الدفعة":"Aucun décant restant dans ce lot",
            "يجب جمع كل التقسيمات المتبقية في مخزن واحد قبل إرجاعها":"Tous les décants restants doivent être réunis dans un seul dépôt avant la reconstitution",
            "العطر الأصلي غير موجود":"Parfum d’origine introuvable","التقسيمات المولدة لا تُشترى مباشرة؛ أنشئها من شاشة التقسيمات":"Les décants générés ne s’achètent pas directement ; créez-les depuis l’écran Décants",
            "لا يمكن تصحيح مخزون التقسيمات أو العطر الناقص يدويًا":"Le stock des décants ou parfums partiels ne peut pas être corrigé manuellement"
          }
          p=Path("app/i18n/messages.ts"); text=p.read_text(); ar_end=text.index('} as const;'); ar=text[:ar_end]; rest=text[ar_end:]
          additions=[]
          for key in message_pairs:
              if f'  "{key}":' not in ar: additions.append(f'  "{key}": "{key}",\n')
          if additions:
              if ar.rstrip().endswith('"العربية": "العربية"'): ar=ar.rstrip()[:-len('"العربية": "العربية"')]+'"العربية": "العربية",\n'
