name: Validate perfume divisions branch
on:
  push:
    branches: [main]
    paths: [.github/workflows/run-perfume-divisions-v1.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perfume-divisions-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply prepared integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/apply-perfume-divisions-v1.yml').read_text()
          start=workflow.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=workflow.index("\n          PY\n",start)
          Path('/tmp/apply-perfume.py').write_text(textwrap.dedent(workflow[start:end]))
          PY
          python /tmp/apply-perfume.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit validated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add perfume divisions inventory flow"
          git push origin HEAD:perfume-divisions-v1
