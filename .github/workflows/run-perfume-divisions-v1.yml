name: Validate perfume divisions branch
on:
  push:
    branches: [main]
    paths: [.github/workflows/run-perfume-divisions-v1.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VALIDATION_REVISION: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perfume-divisions-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply prepared integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/apply-perfume-divisions-v1.yml').read_text()
          start=workflow.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=workflow.index("\n          PY\n",start)
          block=workflow[start:end]
          lines=[line[10:] if line.startswith("          ") else line for line in block.splitlines()]
          Path('/tmp/apply-perfume.py').write_text("\n".join(lines)+"\n")
          PY
          set +e
          python /tmp/apply-perfume.py > /tmp/perfume-patch.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/perfume-patch.log PERFUME_VALIDATION_ERROR.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PERFUME_VALIDATION_ERROR.txt
            git commit -m "Record perfume divisions patch error"
            git push origin HEAD:perfume-divisions-v1
            exit "$status"
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/command/route.ts')
          text=p.read_text()
          strict='const calculated:Array<{id:string;productId:string;description:string;quantity:number;unitPrice:number;lineTotal:number;costAtSale?:number|null;grossProfit?:number|null;perfumeAllocations?:PerfumeAllocation[]}>=[];'
          text=text.replace('const calculated:Record<string,unknown>[]=[];', strict, 1)
          p.write_text(text)
          PY
      - run: npm ci
      - name: Validate tests lint and build
        shell: bash
        run: |
          set +e
          npm test > /tmp/perfume-test.log 2>&1
          test_status=$?
          if [ "$test_status" -eq 0 ]; then npm run lint > /tmp/perfume-lint.log 2>&1; lint_status=$?; else lint_status=0; fi
          if [ "$test_status" -eq 0 ] && [ "$lint_status" -eq 0 ]; then npm run build > /tmp/perfume-build.log 2>&1; build_status=$?; else build_status=0; fi
          set -e
          if [ "$test_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            {
              echo "=== npm test ==="
              cat /tmp/perfume-test.log
              if [ -f /tmp/perfume-lint.log ]; then echo; echo "=== npm run lint ==="; cat /tmp/perfume-lint.log; fi
              if [ -f /tmp/perfume-build.log ]; then echo; echo "=== npm run build ==="; cat /tmp/perfume-build.log; fi
            } > /tmp/validation.log
            git reset --hard HEAD
            cp /tmp/validation.log PERFUME_VALIDATION_ERROR.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PERFUME_VALIDATION_ERROR.txt
            git commit -m "Record perfume divisions validation error"
            git push origin HEAD:perfume-divisions-v1
            exit 1
          fi
      - name: Commit validated branch
        shell: bash
        run: |
          rm -f PERFUME_PATCH_ERROR.txt PERFUME_VALIDATION_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add perfume divisions inventory flow"
          git push origin HEAD:perfume-divisions-v1
