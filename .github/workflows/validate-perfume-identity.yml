name: Validate perfume identity branch
on:
  push:
    branches: [main]
    paths: [.github/workflows/validate-perfume-identity.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-2022
    env:
      VALIDATION_REVISION: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perfume-app-identity
      - name: Update packaged executable expectation
        shell: pwsh
        run: |
          $path = "scripts/desktop-test-server.mjs"
          $text = Get-Content $path -Raw -Encoding utf8
          $old = "file === 'الكرنه.exe'"
          $new = "file === 'الكرنة للعطور.exe'"
          if (-not $text.Contains($old)) { throw "Expected packaged executable check was not found" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($false))
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v7
        id: python
        with: {python-version: "3.12"}
      - name: Configure node-gyp toolchain
        shell: pwsh
        run: |
          "PYTHON=${{ steps.python.outputs.python-path }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run desktop:prepare
      - run: npm run desktop:rebuild-native
      - run: npm run desktop:test-native
      - run: npm run desktop:test-server
      - run: npm run desktop:dist:win
      - run: npm run desktop:test-packaged
      - name: Verify isolated installer
        shell: pwsh
        run: |
          $artifact = "dist/AlKarna-Perfume-Setup-x64.exe"
          if (-not (Test-Path $artifact -PathType Leaf)) { throw "Missing Windows artifact: $artifact" }
          if ((Get-Item $artifact).Length -le 1MB) { throw "Windows artifact is truncated: $artifact" }
      - name: Commit validated executable expectation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/desktop-test-server.mjs
          git commit -m "Expect perfume desktop executable name"
          git push origin HEAD:perfume-app-identity
