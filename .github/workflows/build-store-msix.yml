name: Build Microsoft Store MSIX
on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Partner Center: Package/Identity/Name'
        required: true
        type: string
      publisher:
        description: 'Partner Center: Package/Identity/Publisher (CN=...)'
        required: true
        type: string
      publisher_display_name:
        description: 'Partner Center: Package/Properties/PublisherDisplayName'
        required: true
        type: string
      display_name:
        description: 'Exact app name reserved in Partner Center'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run test:production-legacy
      - run: npm run desktop:prepare
      - run: npm run desktop:rebuild-native
      - run: npm run desktop:test-native
      - run: npm run desktop:test-server
      - name: Read exact Store identity
        shell: pwsh
        env:
          STORE_IDENTITY: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_NAME: ${{ inputs.publisher_display_name }}
          STORE_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          @{identityName=$env:STORE_IDENTITY; publisher=$env:STORE_PUBLISHER; publisherDisplayName=$env:STORE_PUBLISHER_NAME; displayName=$env:STORE_DISPLAY_NAME} | ConvertTo-Json | Set-Content -LiteralPath store-identity.local.json -Encoding utf8NoBOM
      - run: npm run desktop:package:msix
      - name: Verify Store MSIX
        shell: pwsh
        env:
          STORE_IDENTITY: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist/store -Filter '*.msix')
          if ($packages.Count -ne 1) { throw 'Expected exactly one Store MSIX' }
          $package = $packages[0]
          ./scripts/verify-msix.ps1 -PackagePath $package.FullName -IdentityName $env:STORE_IDENTITY -Publisher $env:STORE_PUBLISHER
      - uses: actions/upload-artifact@v7
        with:
          name: AlKarna-Perfume-Store-MSIX-${{ github.run_number }}
          path: |
            dist/store/*.msix
            dist/store/*.sha256
            dist/store/BUILD-INFO.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
