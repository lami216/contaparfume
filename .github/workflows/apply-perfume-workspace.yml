name: Apply tested perfume workspace changes
on:
  push:
    branches: [repair/perfume-workspace-native-backup]
    paths: [.github/workflows/apply-perfume-workspace.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'lami216/contaparfume' && github.ref == 'refs/heads/repair/perfume-workspace-native-backup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify exact reviewed source and apply checked edits
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          expected = 'a4bce41c89c39fecfc1e8482f77fe65861e1425d'
          if subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() != expected:
              raise RuntimeError('Branch advanced; refusing stale edits')
          encoded = ''.join(Path('scripts/perfume-review-'+str(i)+'.b64').read_text().strip() for i in range(4))
          raw = lzma.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest() != '7343418c1d30ee3d0810366e59f61c29a09efbd3e0667fef96985e57c854116d':
              raise RuntimeError('Reviewed edit bundle does not match')
          records = json.loads(raw)
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          output = {}
          for item in records:
              path = Path(item['path'])
              if path.is_absolute() or '..' in path.parts or path.parts[0] not in ['app','desktop','lib','tests','package.json','.github']:
                  raise RuntimeError('Unexpected destination')
              before = path.read_bytes() if path.exists() else None
              if (blob(before) if before is not None else None) != item['old']:
                  raise RuntimeError('Source changed: '+str(path))
              if item['new'] is None:
                  output[path] = None
                  continue
              value = before.decode('utf-8') if before is not None else ''
              for start,end,replacement in reversed(item['edits']):
                  value = value[:start]+replacement+value[end:]
              data = value.encode('utf-8')
              if blob(data) != item['new']:
                  raise RuntimeError('Patched result differs from tested file: '+str(path))
              output[path] = data
          for path,data in output.items():
              if data is None: path.unlink()
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          print('Applied',len(output),'reviewed files with matching before/after hashes')
          PY
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Commit verified implementation and remove temporary transfer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-perfume-workspace.yml scripts/perfume-review-{0,1,2,3}.b64
          git add app desktop lib tests package.json .github/workflows/prepare-perfume-review.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Restore native backup saving and organize auditable perfume management workflows'
          git push origin HEAD:refs/heads/repair/perfume-workspace-native-backup
